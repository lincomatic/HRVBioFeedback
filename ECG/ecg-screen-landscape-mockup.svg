<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760">
  <defs>
    <pattern id="minorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dce8ed" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minorGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#b7ccd4" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1520" height="760" rx="42" fill="#090d12"/>
  <rect x="24" y="24" width="1472" height="712" rx="30" fill="#121920"/>

  <path d="M64 79l-10 10 10 10M54 89h30" fill="none"
        stroke="#d9e1e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="760" y="98" text-anchor="middle" fill="#f4f7fa"
        font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">ECG</text>
  <circle cx="1439" cy="88" r="8" fill="#64db9b"/>
  <text x="1418" y="94" text-anchor="end" fill="#aeb9c4"
        font-family="Segoe UI, Arial, sans-serif" font-size="15">LIVE</text>

  <!-- Left control rail -->
  <g filter="url(#shadow)">
    <rect x="44" y="136" width="180" height="136" rx="20" fill="#1b3e52"/>
    <path d="M86 171v46M106 171v46" stroke="#72c8e8" stroke-width="9" stroke-linecap="round"/>
    <text x="150" y="201" text-anchor="middle" fill="#8ad9f7"
          font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Pause</text>
    <text x="150" y="228" text-anchor="middle" fill="#77a9bd"
          font-family="Segoe UI, Arial, sans-serif" font-size="13">Plot only</text>

    <rect x="44" y="288" width="180" height="136" rx="20" fill="#46262d"/>
    <rect x="80" y="331" width="36" height="36" rx="7" fill="#f07883"/>
    <text x="158" y="353" text-anchor="middle" fill="#ff939c"
          font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Stop</text>
    <text x="158" y="380" text-anchor="middle" fill="#b8878d"
          font-family="Segoe UI, Arial, sans-serif" font-size="13">End stream</text>

    <rect x="44" y="440" width="180" height="136" rx="20" fill="#183f34"/>
    <circle cx="88" cy="482" r="20" fill="#ff5f70"/>
    <circle cx="88" cy="482" r="9" fill="#7e2933"/>
    <text x="158" y="505" text-anchor="middle" fill="#8ce0b5"
          font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Record</text>
    <text x="158" y="532" text-anchor="middle" fill="#72ae8c"
          font-family="Segoe UI, Arial, sans-serif" font-size="13">Includes buffer</text>
  </g>

  <rect x="44" y="596" width="180" height="78" rx="18" fill="#202933"/>
  <circle cx="68" cy="619" r="7" fill="#64db9b"/>
  <text x="86" y="624" fill="#e8edf2"
        font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">130 Hz</text>
  <text x="64" y="653" fill="#8f9ca8"
        font-family="Segoe UI, Arial, sans-serif" font-size="13">Buffer 60 sec</text>
  <path d="M168 635h10l5-14 6 24 6-15 5 5h10" fill="none"
        stroke="#64db9b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 18:9 landscape waveform -->
  <rect x="248" y="136" width="1228" height="538" rx="20" fill="#f4fafb"/>
  <rect x="300" y="164" width="1148" height="472" fill="url(#majorGrid)" rx="4"/>

  <text x="326" y="224" fill="#e5394f"
        font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">67</text>
  <text x="397" y="220" fill="#e5394f"
        font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">BPM</text>

  <text x="272" y="194" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">0.9</text>
  <text x="272" y="254" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">0.6</text>
  <text x="272" y="314" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">0.3</text>
  <text x="272" y="374" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">0</text>
  <text x="272" y="434" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">-0.3</text>
  <text x="272" y="494" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">-0.6</text>
  <text x="272" y="554" text-anchor="middle" fill="#788790" font-family="Segoe UI, Arial, sans-serif" font-size="12">-0.9</text>

  <text x="326" y="662" fill="#82919a" font-family="Segoe UI, Arial, sans-serif" font-size="13">-8 s</text>
  <text x="660" y="662" fill="#82919a" font-family="Segoe UI, Arial, sans-serif" font-size="13">-6 s</text>
  <text x="994" y="662" fill="#82919a" font-family="Segoe UI, Arial, sans-serif" font-size="13">-4 s</text>
  <text x="1406" y="662" fill="#82919a" font-family="Segoe UI, Arial, sans-serif" font-size="13">now</text>

  <path d="
    M300 420 L340 418 365 423 390 415 415 420 440 416 465 425
    L485 420 505 404 525 385 540 360 552 590 565 245 580 420
    L605 452 625 420 650 390 675 410 700 422 725 423 750 417
    L775 420 800 414 825 423 850 418 875 409 900 422
    L925 417 945 400 965 380 980 355 992 592 1005 240 1020 420
    L1045 455 1065 420 1090 389 1115 409 1140 421 1165 423 1190 417
    L1215 420 1240 414 1265 422 1290 418 1315 410 1340 421
    L1365 416 1385 397 1405 372 1420 346 1432 590 1448 240 1460 420"
    fill="none" stroke="#1687e8" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <text x="760" y="716" text-anchor="middle" fill="#83909c"
        font-family="Segoe UI, Arial, sans-serif" font-size="14">
    Pause or Stop enables chart pinch-to-zoom and horizontal pan
  </text>
  <text x="760" y="742" text-anchor="middle" fill="#626f7c"
        font-family="Segoe UI, Arial, sans-serif" font-size="13">
    ECG acquisition and recording continue while plotting is paused
  </text>
</svg>
